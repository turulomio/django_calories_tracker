name: Django CI/CD

on:
  push:
    branches: [ "main", "64-create-docker-image-and-update-actions" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Run Tests in Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.e2e
          load: true
          tags: django_calories_tracker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Django Tests inside Docker Container
        run: |
          docker run --rm django_calories_tracker:test sh -c "service postgresql start && until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done && python manage.py test"

  publish_docker:
    name: Build & Publish Docker Images
    needs: build_and_test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Standard Image (latest)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            turulomio/django_calories_tracker:latest
            turulomio/django_calories_tracker:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push E2E Testing Image (e2e)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.e2e
          push: true
          tags: |
            turulomio/django_calories_tracker:e2e
            turulomio/django_calories_tracker:e2e-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
